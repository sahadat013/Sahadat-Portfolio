<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sahadat Hossain — Virtual Assistant, Lead Generation Specialist and Logo Designer.">
  <title>Sahadat Hossain — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#home" class="logo">SH<span>.</span></a>
    <nav id="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="menu" aria-label="Open menu" aria-expanded="false">
      <i></i><i></i><i></i>
    </button>
  </header>

  <main>
    <section id="home" class="svg-section first">
      <div class="section-tag">01 / HOME</div>
      <div class="art-wrap"><img src="assets/project-1.svg" alt="Portfolio home artwork"></div>
      <a class="next" href="#about">Scroll <span>↓</span></a>
    </section>

    <section id="about" class="svg-section">
      <div class="section-tag">02 / ABOUT</div>
      <div class="art-wrap"><img src="assets/project-2.svg" alt="About artwork"></div>
    </section>

    <section id="experience" class="svg-section">
      <div class="section-tag">03 / EXPERIENCE</div>
      <div class="art-wrap"><img src="assets/project-3.svg" alt="Experience and education artwork"></div>
    </section>

    <section id="skills" class="svg-section">
      <div class="section-tag">04 / SKILLS</div>
      <div class="art-wrap"><img src="assets/project-4.svg" alt="Skills and proficiencies artwork"></div>
    </section>

    <section id="work" class="svg-section">
      <div class="section-tag">05 / SAMPLE WORK</div>
      <div class="art-wrap"><img src="assets/project-5.svg" alt="Sample work artwork"></div>
    </section>

    <section id="contact" class="svg-section last">
      <div class="section-tag">06 / CONTACT</div>
      <div class="art-wrap"><img src="assets/project-6.svg" alt="Reach out contact artwork"></div>
      <a class="top" href="#home">Back to top ↑</a>
    </section>
  </main>

  <div class="progress" aria-hidden="true"><span></span></div>
  <script src="script.js"></script>
</body>
</html>
