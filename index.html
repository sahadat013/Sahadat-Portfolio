<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sahadat Hossain — Portfolio">
  <title>Sahadat Hossain — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="Sahadat Hossain home">SH<span>.</span></a>

    <button class="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="art-section first">
      <div class="art-stage">
        <img src="assets/project-1.svg" alt="Sahadat Hossain portfolio home artwork" loading="eager">
      </div>
      <a class="scroll-cue" href="#about" aria-label="Scroll to About">SCROLL <span>↓</span></a>
    </section>

    <section id="about" class="art-section">
      <div class="art-stage">
        <img src="assets/project-2.svg" alt="About portfolio artwork" loading="lazy">
      </div>
    </section>

    <section id="experience" class="art-section">
      <div class="art-stage">
        <img src="assets/project-3.svg" alt="Experience and education portfolio artwork" loading="lazy">
      </div>
    </section>

    <section id="skills" class="art-section">
      <div class="art-stage">
        <img src="assets/project-4.svg" alt="Skills and proficiencies portfolio artwork" loading="lazy">
      </div>
    </section>

    <section id="work" class="art-section">
      <div class="art-stage">
        <img src="assets/project-5.svg" alt="Sample work portfolio artwork" loading="lazy">
      </div>
    </section>

    <section id="contact" class="art-section last">
      <div class="art-stage">
        <img src="assets/project-6.svg" alt="Contact portfolio artwork" loading="lazy">
      </div>

      <!-- Add your real social links later by replacing the # values below. -->
      <div class="social-links" aria-label="Social media links">
        <a href="#" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="#" target="_blank" rel="noopener noreferrer">Behance</a>
      </div>

      <a class="top-cue" href="#home">BACK TO TOP ↑</a>
    </section>
  </main>

  <div class="progress" aria-hidden="true"><span></span></div>
  <script src="script.js"></script>
</body>
</html>
